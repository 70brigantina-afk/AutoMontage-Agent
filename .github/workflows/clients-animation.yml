name: Clients animation with music
on:
  push:
    paths:
      - '.github/workflows/clients-animation.yml'
      - 'scripts/clients-animation.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow
      - name: Create animation and music
        run: python scripts/clients-animation.py
      - uses: actions/upload-artifact@v4
        with:
          name: clients-video-with-music
          path: out/clients-with-music.mp4
          if-no-files-found: error
          retention-days: 7
